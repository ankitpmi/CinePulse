events {}

http {
  resolver 127.0.0.11 valid=30s;

  server {
    listen 80;
    server_name cinepulse.duckdns.org;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name cinepulse.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/cinepulse.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cinepulse.duckdns.org/privkey.pem;

    client_max_body_size 50M;

    # Backend API
    location / {
      set $backend_upstream http://backend:3000;
      proxy_pass $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }

    # Grafana — proxy without subpath rewriting
    location /grafana/ {
      auth_basic "Monitoring";
      auth_basic_user_file /etc/nginx/.htpasswd;

      set $grafana_upstream http://grafana:3000;
      proxy_pass $grafana_upstream;          # ← no trailing slash, pass full path
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_redirect off;
    }
  }
}