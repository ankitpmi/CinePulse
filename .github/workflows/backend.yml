name: Backend CI/CD
permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "docker-compose.prod.yml"
      - "Dockerfile"
      - "nginx.prod.conf"
      - "package.json"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "docker-compose.prod.yml"
      - "Dockerfile"
      - "nginx.prod.conf"
      - "package.json"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy Backend to EC2
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            cd /home/ubuntu/CinePulse

            echo "Pulling latest code..."
            git pull origin main

            echo "Saving current commit for rollback..."
            PREVIOUS_COMMIT=$(git rev-parse HEAD~1)
            echo "Previous commit: $PREVIOUS_COMMIT"


            echo "Setting up Grafana basic auth..."
            mkdir -p ./monitoring
            sudo rm -rf ./monitoring/.htpasswd
            htpasswd -cb ./monitoring/.htpasswd \
              ${{ secrets.GRAFANA_BASIC_AUTH_USER }} \
              ${{ secrets.GRAFANA_BASIC_AUTH_PASSWORD }}


            if [ ! -f ./monitoring/.htpasswd ]; then
              echo "❌ .htpasswd file creation failed!"
              exit 1
            fi
            echo "✅ .htpasswd created successfully"


            echo "Rebuilding backend container..."
            docker compose -f docker-compose.prod.yml up -d --build || (
              echo "❌ Build failed! Rolling back..."
              git checkout $PREVIOUS_COMMIT -- backend/ package.json
              docker compose -f docker-compose.prod.yml up -d
              exit 1
            )

            echo "Cleaning unused docker images..."
            docker image prune -f

            echo "Waiting for backend to start..."
            sleep 15

            echo "Checking backend health..."
            HEALTH_PASSED=false
            for i in 1 2 3 4 5; do
              if docker exec cine-backend curl -f http://localhost:3000/healthStatus; then
                HEALTH_PASSED=true
                break
              fi
              echo "Attempt $i failed, retrying in 5s..."
              sleep 5
            done

            if [ "$HEALTH_PASSED" = false ]; then
              echo "❌ Health check failed! Rolling back..."
              git checkout $PREVIOUS_COMMIT -- backend/ package.json
              docker compose -f docker-compose.prod.yml up -d
              echo "⚠️ Rolled back to previous version!"
              exit 1
            fi

            echo "✅ Backend deployed and healthy!"

      - name: Configure Git
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config --global user.name "ankitpmi"
          git config --global user.email "ankit.prajapati@mindinventory.com"
          git remote set-url origin https://x-access-token:${{ secrets.DEVOPS_GITHUB_TOKEN }}@github.com/ankitpmi/CinePulse.git

      # ── Changelog + Release (main push only) ─────────────────────
      - name: Generate Changelog
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: changelog
        uses: TriPSs/conventional-changelog-action@v5
        with:
          github-token: ${{ secrets.DEVOPS_GITHUB_TOKEN }}
          output-file: "CHANGELOG.md"
          version-file: "./package.json"
          release-count: "0"
          skip-commit: "false"
          skip-on-empty: "true"
          git-message: "chore(release): {version}"
          git-user-name: "ankitpmi"
          git-user-email: "ankit.prajapati@mindinventory.com"

      - name: Create GitHub Release
        if: |
          github.ref == 'refs/heads/main' &&
          github.event_name == 'push' &&
          steps.changelog.outputs.skipped == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: 🚀 CinePulse Backend Release ${{ steps.changelog.outputs.tag }}
          body: |
            🚀 New backend deployed successfully

            🔹 Commit SHA: ${{ github.sha }}
            🔹 Branch: ${{ github.ref_name }}
            🔹 Triggered by: ${{ github.actor }}

            ---

            ## 📋 Changelog
            ${{ steps.changelog.outputs.clean_changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.DEVOPS_GITHUB_TOKEN }}

      # ── Deployment Summary ────────────────────────────────────────
      - name: Deployment Summary
        if: always()
        run: |
          echo "### 🚀 Backend Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "| **Grafana** | https://cinepulse.duckdns.org/grafana/ |" >> $GITHUB_STEP_SUMMARY