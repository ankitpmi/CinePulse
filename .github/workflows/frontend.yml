name: Frontend CI/CD
permissions:
  contents: write

on:
  push:
    branches: ['*']
    paths:
      - "frontend/**"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Build React app
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
      
      - name: Print success message
        run: echo "Frontend build created successfully 📦 📚"
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Deploy to S3
        run: |
          aws s3 sync frontend/dist s3://${{ secrets.S3_BUCKET_NAME }} --delete
      
      - name: Done
        run: echo "🚀 Frontend deployed successfully!"


      # ── Changelog + Release (main only) ──────────────────────────
      - name: Generate Changelog
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: changelog
        uses: TriPSs/conventional-changelog-action@v5
        with:
          github-token: ${{ secrets.DEVOPS_GITHUB_TOKEN }}
          output-file: "CHANGELOG.md"
          version-file: "./package.json"
          release-count: "0"
          skip-commit: "false"
          skip-on-empty: "true"
          git-message: "chore(release): {version} [skip ci]"

      - name: Create Git tag and Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.changelog.outputs.skipped == 'false'     
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: 🚀 CinePulse Frontend Release ${{ steps.changelog.outputs.tag }}
          body: |
            🚀 New frontend build deployed successfully

            🔹 Commit SHA: ${{ github.sha }}
            🔹 Branch: ${{ github.ref_name }}
            🔹 Triggered by: ${{ github.actor }}

            📦 Commit Message:
            ${{ github.event.head_commit.message }}

            🕒 Build Time: ${{ github.event.head_commit.timestamp }}

            ---

            ## 📋 Changelog
            ${{ steps.changelog.outputs.clean_changelog }}

        env:
          GITHUB_TOKEN: ${{ secrets.DEVOPS_GITHUB_TOKEN }}

