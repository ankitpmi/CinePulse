services:

  redis:
    image: redis:7-alpine
    container_name: cine-redis
    restart: unless-stopped
    expose:
      - "6379"            # internal only, not reachable from internet
    volumes:
      - redis_data:/data
    networks:
      - cine-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./
    container_name: cine-backend
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env.docker
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cine-network

  nginx:
    image: nginx:latest
    container_name: cine-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./monitoring/.htpasswd:/etc/nginx/.htpasswd:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
      - grafana
    restart: unless-stopped
    networks:
      - cine-network

  prom-server:
    image: prom/prometheus
    container_name: prometheus
    expose:
      - "9090"
    volumes:
      - ./prometheus-config.yml:/etc/prometheus/prometheus.yml
    networks:
      - cine-network

  loki:
    image: grafana/loki
    container_name: loki
    expose:
      - "3100"
    networks:
      - cine-network

  grafana:
    image: grafana/grafana-oss
    container_name: grafana
    expose:
      - "3000"
    environment:
      - GF_SERVER_ROOT_URL=https://cinepulse.duckdns.org/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SERVER_DOMAIN=cinepulse.duckdns.org
      - GF_SERVER_PROTOCOL=http
      - GF_SERVER_ENFORCE_DOMAIN=false
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - cine-network

networks:
  cine-network:
    driver: bridge

volumes:
  mongo_data:
  grafana_data:
  redis_data:      # added