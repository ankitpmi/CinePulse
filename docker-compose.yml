  #     test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
   

  backend:
    build:
      context: ./
    container_name: cine-backend
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env.docker
    # depends_on:
    #   mongo:
    #     condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    networks:
      - cine-network

  nginx:
    image: nginx:latest
    container_name: cine-nginx
    ports:
      - "80:80"   # 👈 public access
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
    - cine-network   # 👈 MUST BE PRESENT

  # frontend:
  #   build:
  #     context: ./frontend
  #   container_name: cine-frontend
  #   restart: unless-stopped
  #   ports:
  #     - "5173:80"
  #   depends_on:
  #     - backend
  #   networks:
  #     - cine-network

  prom-server:
    image: prom/prometheus
    ports:
      - 9090:9090
    volumes:
      - ./prometheus-config.yml:/etc/prometheus/prometheus.yml

networks:
  cine-network:
    driver: bridge

volumes:
  mongo_data: 