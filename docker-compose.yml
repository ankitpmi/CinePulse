  redis:
    image: redis:7-alpine
    container_name: cine-redis
    restart: unless-stopped
    ports:
      - "6379:6379"       # exposed locally for redis-cli debugging
    volumes:
      - redis_data:/data
    networks:
      - cine-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./
    container_name: cine-backend
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env.docker
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cine-network

  nginx:
    image: nginx:latest
    container_name: cine-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - grafana
    restart: unless-stopped
    networks:
      - cine-network

  frontend:
    build:
      context: ./frontend
    container_name: cine-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - cine-network

  prom-server:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus-config.yml:/etc/prometheus/prometheus.yml
    networks:
      - cine-network

  loki:
    image: grafana/loki
    container_name: loki
    ports:
      - "3100:3100"
    networks:
      - cine-network

  grafana:
    image: grafana/grafana-oss
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - cine-network

networks:
  cine-network:
    driver: bridge

volumes:
  mongo_data:
  grafana_data:
  redis_data:      # added